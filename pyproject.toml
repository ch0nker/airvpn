[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "airvpn"
version = "0.2.3"
authors = [
    { name = "chonker" }
]
description = "A Python wrapper for the AirVPN API"
license = { text = "MIT" }
requires-python = ">= 3.11"
readme = "README.md"
dynamic = ["dependencies"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://airvpn.chonker.cc/"
Repository = "https://github.com/ch0nker/airvpn.git"
Changelog = "https://airvpn.chonker.cc/changelog/"
Documentation = "https://airvpn.chonker.cc/airvpn/"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["airvpn*"]